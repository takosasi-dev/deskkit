[project]
name = "deskkit"
version = "0.2.0"
description = "DeskKit — PC 生活の QOL を上げる常駐ツール群(ModeShift / DropSort / LayoutKeep / ClipShelf)"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.6"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "BLE"]
ignore = ["E501", "N802", "N812", "SIM105"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["win32_real: 実機の Win32 に依存するテスト"]
addopts = "-m 'not win32_real'"
